<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC raw test</title></head>
<body>
<div id="log" style="font-family:monospace;white-space:pre-wrap;padding:12px;"></div>
<script>
var logEl = document.getElementById('log');
function log(m){ logEl.textContent += new Date().toISOString().substr(14,9) + ' ' + m + '\n'; }
// TEST 1: candidate gathering
log('--- TEST 1: gather candidates ---');
var pc1 = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
var n = 0;
pc1.onicecandidate = function(e){
  if (e.candidate) { n++; if (n <= 6) log('cand[' + n + ']: ' + e.candidate.candidate.substr(0, 90)); }
  else log('gathering DONE, total=' + n);
};
pc1.onicegatheringstatechange = function(){ log('gatheringState: ' + pc1.iceGatheringState); };
pc1.createDataChannel('t');
pc1.createOffer().then(function(o){ return pc1.setLocalDescription(o); }).catch(function(e){ log('offer err: ' + e); });
// TEST 2: loopback between two PCs in same page (no signaling server)
setTimeout(function(){
  log('--- TEST 2: loopback a<->b ---');
  var a = new RTCPeerConnection(), b = new RTCPeerConnection();
  a.onicecandidate = function(e){ if (e.candidate) { try { b.addIceCandidate(e.candidate); } catch(err){} } };
  b.onicecandidate = function(e){ if (e.candidate) { try { a.addIceCandidate(e.candidate); } catch(err){} } };
  var dcA = a.createDataChannel('chat');
  dcA.onopen = function(){ log('LOOPBACK dc open! sending ping'); dcA.send('ping'); };
  dcA.onmessage = function(e){ log('LOOPBACK dcA got: ' + e.data); };
  b.ondatachannel = function(ev){
    var dcB = ev.channel;
    dcB.onopen = function(){ log('LOOPBACK dcB open'); };
    dcB.onmessage = function(e){ log('LOOPBACK dcB got: ' + e.data + ' -> reply pong'); dcB.send('pong'); };
  };
  a.createOffer().then(function(o){ return a.setLocalDescription(o); })
   .then(function(){ return b.setRemoteDescription(a.localDescription); })
   .then(function(){ return b.createAnswer(); })
   .then(function(ans){ return b.setLocalDescription(ans); })
   .then(function(){ return a.setRemoteDescription(b.localDescription); })
   .catch(function(e){ log('loopback err: ' + e); });
  setTimeout(function(){
    log('loopback states: a.ice=' + a.iceConnectionState + ' b.ice=' + b.iceConnectionState);
    log('--- done ---');
  }, 15000);
}, 8000);
</script>
</body></html>
